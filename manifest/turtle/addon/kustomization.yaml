# The ConfigMap the Cluster API Operator reads this provider out of: name is the version, the
# label is what a CAPIProvider's fetchConfig selector matches, and the suffix hash is disabled
# because the operator looks the ConfigMap up by that exact name.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: v0.1.2 # x-release-please-version
    namespace: caapz-system
    files:
      - components=addon-components.yaml
      - metadata=metadata.yaml
    options:
      disableNameSuffixHash: true
      labels:
        provider-components: addon-zarf
