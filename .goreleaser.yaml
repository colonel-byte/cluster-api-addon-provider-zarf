# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # The two files clusterctl downloads from a release. They are the actual deliverable here -
    # the binaries and the image below are what they point at, but clusterctl reads these. A
    # release missing one of them installs nothing, and the error names a 404 rather than a
    # missing file.
    - go run ./magefiles/core release:manifests {{ .Version }}

builds:
  - id: cluster-api-addon-provider-zarf
    main: ./cmd/cluster-api-addon-provider-zarf
    binary: cluster-api-addon-provider-zarf
    # The version and commit the binary reports. The symbol path has to match the variables
    # the code actually declares - `go doc <module>/config` rather than a guess, because a
    # `-X` naming a symbol that does not exist is silently ignored and the binary reports the
    # zero value.
    ldflags:
      - -s
      - -w
      - -X github.com/colonel-byte/cluster-api-addon-provider-zarf/config.CLIVersion={{ .Version }}
      - -X github.com/colonel-byte/cluster-api-addon-provider-zarf/config.CLICommit={{ .ShortCommit }}
    gcflags:
      - all=-l
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - arm64
      - amd64
    goamd64:
      - v1
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Pinned to the one build by id. Without `ids`, every build lands in this archive, and a
  # second build added later would quietly gain a second binary in the same tarball.
  - id: cluster-api-addon-provider-zarf
    ids:
      - cluster-api-addon-provider-zarf
    formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

dockers_v2:
  - id: manager
    ids:
      - cluster-api-addon-provider-zarf
    images:
      - ghcr.io/colonel-byte/cluster-api-addon-provider-zarf-controller
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: containers/manager/Dockerfile

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc

# Key-based signing with the keypair whose public half is cosign.pub at the repository root.
# Both secrets have to be set or goreleaser fails the run - there is no "unsigned if the key
# is missing" fallback here, deliberately, since a release that is quietly unsigned is worse
# than one that did not happen.
signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    stdin: "{{ .Env.COSIGN_PASSWORD }}"
  - id: archive
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
    stdin: "{{ .Env.COSIGN_PASSWORD }}"

docker_signs:
  - id: images
    cmd: cosign
    args:
      - "sign"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "${artifact}@${digest}"
      - "--yes"
    stdin: "{{ .Env.COSIGN_PASSWORD }}"

release:
  github:
    owner: colonel-byte
    name: cluster-api-addon-provider-zarf
  extra_files:
    # clusterctl fetches these two by name from the release assets.
    - glob: out/addon-components.yaml
    - glob: out/metadata.yaml
  name_template: "v{{ .Version }}"
  mode: append
  footer: |-
    ---

    ### Verify release artifacts with Cosign

    Release archives are signed with [Cosign](https://docs.sigstore.dev/cosign/).

    Find the public key at [`cosign.pub`](https://raw.githubusercontent.com/colonel-byte/cluster-api-addon-provider-zarf/refs/tags/{{ .Tag }}/cosign.pub)

    Verify a binary archive:

    ```console
    cosign verify-blob --key cosign.pub --bundle cluster-api-addon-provider-zarf_Linux_x86_64.tar.gz.sigstore.json cluster-api-addon-provider-zarf_Linux_x86_64.tar.gz
    ```

    Verify the controller image:

    ```console
    cosign verify --key cosign.pub ghcr.io/colonel-byte/cluster-api-addon-provider-zarf-controller:{{ .Version }}
    ```
