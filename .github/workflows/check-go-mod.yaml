---
name: Check for go mod changes

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate-go-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # A dependency added without re-running `mage dev:vendor` leaves go.mod, go.sum and
      # vendor/ disagreeing, and the build that notices is a release built with no network.
      # Failing here instead is the whole point of the job.
      #
      # The regenerate step in the middle is not optional: vendor/ carries two generated
      # osv-scanner.toml files that `go mod vendor` deletes, so without it this job diffs them
      # away on every run. It is the same target `dev:vendor` ends with, so a tree that was
      # vendored properly comes out byte-identical and the diff still reports only real drift.
      - name: Test go mod
        run: |
          go mod tidy
          go mod vendor
          go run ./magefiles/core dev:writeOSVOverrides
          git diff --exit-code go.mod go.sum vendor/

      # go run ./magefiles/core rather than mage: same targets, but it builds from vendor/ and
      # needs no mage binary on the runner.
      #
      # This also fails on a dependency bump that brings in a module shipping a lockfile nothing
      # covers yet - the half of dev:verifyVendor no workflow can fix for you, because it needs
      # an entry added to Overrides in magefiles/pkg/osv/osv.go by a person.
      - name: Verify the offline build
        run: go run ./magefiles/core dev:verifyVendor

      # test/e2e is a separate module and deliberately unvendored (the exception is recorded in
      # magefiles/AGENTS.md), so the root tidy above cannot reach it - a nested module is
      # invisible to the parent's `./...` by construction. It still drifts, and for a reason
      # that has nothing to do with anyone editing it: it requires this repository's own module
      # through a `replace ../..`, so every dependency the root module moves changes what that
      # module's own graph resolves to. The drift is silent until `go vet` inside test/e2e
      # refuses to run, which is how it was found.
      #
      # Tidy only, never vendor: vendoring it would bloat every clone to protect an
      # offline-build invariant that does not apply to a dev/CI-only surface.
      - name: Test go mod (test/e2e)
        working-directory: test/e2e
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
