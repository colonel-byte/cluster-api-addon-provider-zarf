---
name: goreleaser

on:
  push:
    tags:
      - "*"

# Read only at the top so that a job has to ask for what it writes. See the job block
# below for what it needs and why.
permissions:
  contents: read

jobs:
  goreleaser:
    # - contents: write creates the release and uploads the archives
    # - packages: write pushes the controller image
    # - id-token: write is the OIDC token the attestation is bound to
    # - attestations: write proves provenance of the built artifacts
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required, not a precaution: goreleaser reads the tag history to
      # work out the version and to build the changelog, and a shallow clone has neither.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The `sboms:` block shells out to syft, so it has to be on PATH before goreleaser runs.
      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Setup cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Setup golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The dockers_v2 block builds the controller image for both architectures, so the
      # cross-platform build machinery and the registry login have to exist before goreleaser
      # runs. Same three steps, same pins, as cluster-api-provider-cargoship's release workflow.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASS }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_KEY }}

      # The two files clusterctl fetches by name. Checked rather than assumed, because a release
      # missing one of them fails at `clusterctl init` time with a 404 that names a URL rather
      # than a build step, and the fix is a whole new tag.
      - name: Check clusterctl's artifacts were published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in addon-components.yaml metadata.yaml; do
            if ! gh release view "${GITHUB_REF_NAME}" --json assets \
                --jq '.assets[].name' | grep -qx "${asset}"; then
              echo "::error::${asset} is missing from the release; clusterctl cannot install this version"
              exit 1
            fi
          done

      - name: Attest packages
        id: attest-packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Publish provenance with the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest-packages.outputs.bundle-path }}" packages.intoto.jsonl
          gh release upload "${GITHUB_REF_NAME}" packages.intoto.jsonl --clobber

  # The two air-gapped install artifacts. Both carry this release's controller image - the Zarf
  # package by value, the operator artifact by reference in the component manifest - so both have
  # to wait for goreleaser, and needs is what guarantees that. Watching for the release event
  # instead does not work: release-please publishes the release well before goreleaser has pushed
  # an image, so a package build would pull a tag that does not exist yet. The Zarf package also
  # carries the operator artifact itself, so it additionally waits for that publish.
  #
  # Version tags only. goreleaser takes every tag, while release-please only ever pushes vN.N.N,
  # and both of these name a release version in a published reference.
  #
  # secrets: inherit passes the Cosign key each one signs with. Each permissions block is written
  # to match the called workflow's own job exactly: a caller's grant is the ceiling for what it
  # calls, so these can be narrowed down the chain but never widened.
  publish-oci-artifact:
    permissions:
      contents: read
      packages: write
      id-token: write
    needs:
      - goreleaser
    if: startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/publish-oci-artifact.yaml
    secrets: inherit

  publish-zarf-package:
    permissions:
      contents: read
      packages: write
      id-token: write
    needs:
      - goreleaser
      - publish-oci-artifact
    if: startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/publish-zarf-package.yaml
    secrets: inherit
