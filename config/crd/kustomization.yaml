# The move label rides on the CRDs because that is where clusterctl reads it: a pivot moves the
# instances of every labeled CRD. Proxies are not re-derivable and must move; releases are, but
# moving them avoids a re-deploy window - docs/dev/architecture.md §9.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: false
    pairs:
      clusterctl.cluster.x-k8s.io/move: ""
resources:
  - bases/addons.colonel-byte.dev_zarfpackageproxies.yaml
  - bases/addons.colonel-byte.dev_zarfpackagereleases.yaml
