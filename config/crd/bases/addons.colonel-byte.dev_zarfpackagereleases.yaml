---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: zarfpackagereleases.addons.colonel-byte.dev
spec:
  group: addons.colonel-byte.dev
  names:
    categories:
    - cluster-api
    kind: ZarfPackageRelease
    listKind: ZarfPackageReleaseList
    plural: zarfpackagereleases
    shortNames:
    - zpr
    singular: zarfpackagerelease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Target cluster
      jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - description: Release phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Deployed package version
      jsonPath: .status.deployedVersion
      name: Version
      type: string
    - description: Time since creation
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Why Ready holds its status
      jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - description: Declared stages settled on this cluster
      jsonPath: .status.appliedStageCount
      name: Applied
      priority: 1
      type: integer
    - description: Stages the proxy declares
      jsonPath: .status.stageCount
      name: Stages
      priority: 1
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZarfPackageRelease records one cluster's deployment of one ZarfPackageProxy. The controller
          creates it with an ownerReference to the CAPI Cluster, so deleting the Cluster garbage-collects
          the release - deliberately, so nothing CAAPZ owns can block cluster deletion.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of ZarfPackageRelease.
            properties:
              clusterRef:
                description: clusterRef names the CAPI Cluster, in this namespace,
                  the package deploys to.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              packageProxyRef:
                description: |-
                  packageProxyRef names the ZarfPackageProxy this release realizes. In this namespace
                  unless cross-namespace selection (--cluster-namespaces) created this release from a
                  proxy in another one.
                properties:
                  name:
                    description: name of the referenced object.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      namespace of the referenced object. Empty means the namespace of the object holding this
                      reference. A namespace other than that one is refused unless the controller was started
                      with a flag naming it (--secret-namespaces for secret references, --cluster-namespaces
                      for the proxy references cross-namespace selection creates), surfaced as a condition with
                      reason CrossNamespaceNotEnabled. See docs/dev/architecture.md §2C.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
            required:
            - clusterRef
            - packageProxyRef
            type: object
          status:
            description: status is the observed state of ZarfPackageRelease.
            properties:
              applied:
                description: applied is true once an ApplyOnce release has executed;
                  it is never reset.
                type: boolean
              appliedStageCount:
                description: |-
                  appliedStageCount is how many declared stages have settled on this cluster - carried as
                  a number because a printer column cannot take the length of a list.
                format: int32
                type: integer
              conditions:
                description: |-
                  conditions detail the release's state: Ready, PackageSignatureVerified,
                  DependenciesSatisfied.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deployedDigest:
                description: |-
                  deployedDigest is the package manifest digest the last successful deploy ran from -
                  recorded per release so a fleet mid-rollout is legible digest by digest (§3).
                type: string
              deployedVersion:
                description: deployedVersion is the package version last deployed
                  successfully.
                type: string
              phase:
                description: phase is where the release is in its lifecycle.
                enum:
                - Pending
                - Deploying
                - Deployed
                - Completed
                - Failed
                - Removing
                type: string
              stageCount:
                description: |-
                  stageCount is how many stages the proxy declared, stamped onto the release so it stays
                  self-describing after a clusterctl move separates it from its proxy. Zero on the
                  single-package form.
                format: int32
                type: integer
              stages:
                description: |-
                  stages are the per-stage applied records of a staged proxy's release, one entry per
                  stage that has run on this cluster, in applied order. The identity each record carries
                  is the controller's own hash of the stage's rendered spec - never the pod-reported
                  digest, which a lost termination message leaves empty (docs/dev/design-package-stages.md,
                  "Per-stage state, not a cursor").
                items:
                  description: |-
                    StageState is one stage's applied record on one cluster: what ran, identified by the spec
                    hash it ran from, and when.
                  properties:
                    appliedAt:
                      description: appliedAt is when the stage's deploy Job completed.
                      format: date-time
                      type: string
                    deployedDigest:
                      description: |-
                        deployedDigest is the digest the stage's pod reported, for display; possibly empty when
                        the termination message was lost, which is why it is never the applied identity.
                      type: string
                    deployedVersion:
                      description: deployedVersion is the package version the stage's
                        pod reported.
                      type: string
                    name:
                      description: name is the declared stage name this record belongs
                        to.
                      type: string
                    specHash:
                      description: |-
                        specHash is the controller's hash of the rendered stage document the applied run was
                        stamped from - the identity a changed stage is detected by.
                      type: string
                    undeclared:
                      description: |-
                        undeclared is true when the spec no longer declares a stage of this name. The record is
                        kept rather than pruned - it is the evidence an ApplyOnce decision rests on.
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
