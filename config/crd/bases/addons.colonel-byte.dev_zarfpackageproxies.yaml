---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: zarfpackageproxies.addons.colonel-byte.dev
spec:
  group: addons.colonel-byte.dev
  names:
    categories:
    - cluster-api
    kind: ZarfPackageProxy
    listKind: ZarfPackageProxyList
    plural: zarfpackageproxies
    shortNames:
    - zpp
    singular: zarfpackageproxy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Reconcile or ApplyOnce
      jsonPath: .spec.strategy
      name: Strategy
      type: string
    - description: Declared package version
      jsonPath: .spec.package.version
      name: Version
      type: string
    - description: Time since creation
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZarfPackageProxy declares a Zarf package's desired state across every CAPI Cluster matching its
          selector. The controller stamps one ZarfPackageRelease per matching cluster and deploys through
          it; the proxy itself never touches a workload cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of ZarfPackageProxy.
            properties:
              clusterSelector:
                description: |-
                  clusterSelector selects the CAPI Clusters this package deploys to, by label. Only
                  Clusters in the proxy's own namespace match unless the controller was started with
                  --cluster-namespaces naming (or wildcarding) others.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              components:
                description: components filters which package components deploy. Empty
                  means the package's defaults.
                items:
                  description: ComponentSelector names a package component to deploy,
                    optionally pinning its flavor.
                  properties:
                    flavor:
                      description: flavor selects a component flavor, overriding auto-detection.
                      type: string
                    name:
                      description: name is the component's name in the package definition.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              dependsOn:
                description: |-
                  dependsOn names other ZarfPackageProxies in the same namespace whose releases must be
                  Deployed (or Completed, for ApplyOnce) on a cluster before this package deploys there.
                items:
                  type: string
                type: array
              init:
                description: init controls Zarf auto-initialization of uninitialized
                  target clusters.
                properties:
                  autoInit:
                    description: |-
                      autoInit deploys the Zarf init package first when the target cluster has no zarf-state
                      secret in the zarf namespace.
                    type: boolean
                  storageClass:
                    description: storageClass is the storage class the init package
                      uses for Zarf's internal registry.
                    type: string
                type: object
              package:
                description: package is the package source and verification settings.
                properties:
                  api:
                    description: |-
                      api asserts the package's Zarf schema version. When unset, the controller detects it
                      from the pulled artifact; when set, a mismatch with the artifact fails the release
                      before any deploy runs. Declaring v1alpha1 is required to use spec.set.
                    enum:
                    - v1alpha1
                    - v1beta1
                    type: string
                  repository:
                    description: repository is the OCI repository holding the package,
                      without a tag.
                    type: string
                  signatureKeySecretRef:
                    description: |-
                      signatureKeySecretRef names a Secret holding the Cosign public key ("cosign.pub" key)
                      the package signature is verified against before extraction. When unset, signature
                      verification is skipped. In the proxy's namespace unless its namespace field names one
                      the controller's --secret-namespaces flag permits.
                    properties:
                      name:
                        description: name of the referenced object.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          namespace of the referenced object. Empty means the namespace of the object holding this
                          reference. A namespace other than that one is refused unless the controller was started
                          with a flag naming it (--secret-namespaces for secret references, --cluster-namespaces
                          for the proxy references cross-namespace selection creates), surfaced as a condition with
                          reason CrossNamespaceNotEnabled. See docs/dev/architecture.md §2C.
                        maxLength: 63
                        type: string
                    required:
                    - name
                    type: object
                  version:
                    description: version is the package version (OCI tag) to deploy.
                    type: string
                required:
                - repository
                - version
                type: object
              set:
                additionalProperties:
                  type: string
                description: |-
                  set are Zarf deploy-time variables, supported only by v1alpha1 packages: using it
                  requires spec.package.api: v1alpha1, enforced at admission. Values support the same Go
                  templating as values. Deprecated on the same schedule as v1alpha1 package support.
                type: object
              strategy:
                default: Reconcile
                description: strategy is Reconcile (continuous lifecycle, the default)
                  or ApplyOnce (seed packages).
                enum:
                - Reconcile
                - ApplyOnce
                type: string
              values:
                description: |-
                  values is a structured values tree merged over the package's defaults (zarf.dev/v1beta1
                  structured values). String leaves support Go templates over the target Cluster, for
                  example "{{ .Cluster.metadata.name }}".
                x-kubernetes-preserve-unknown-fields: true
            required:
            - clusterSelector
            - package
            type: object
            x-kubernetes-validations:
            - message: 'spec.set requires spec.package.api: v1alpha1; v1beta1 packages
                take spec.values'
              rule: '!has(self.set) || (has(self.package.api) && self.package.api
                == ''v1alpha1'')'
          status:
            description: status is the observed state of ZarfPackageProxy.
            properties:
              conditions:
                description: |-
                  conditions summarize the proxy's state. Ready is true when every matching cluster's
                  release is Deployed or Completed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              matchingClusters:
                description: matchingClusters are the names of the Clusters the selector
                  currently matches.
                items:
                  type: string
                type: array
              observedGeneration:
                description: observedGeneration is the generation the status reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
