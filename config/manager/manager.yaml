# The controller holds no package cache - packages pull inside deploy pods, which take their
# disk from spec.deployJob.volumes (see "Quirks worth knowing" in AGENTS.md). It does need a
# small scratch volume: resolution writes a package's metadata layers to /tmp, which this
# container's read-only root filesystem would otherwise refuse.
# --deploy-image is left unset here: the manager reads the image its own pod runs and defaults
# deploy Jobs to it, so the release pipeline's one rewrite of the container image below serves
# both. The downward-API environment that makes it possible is on the container.
---
apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      containers:
        - name: manager
          image: controller:latest
          command:
            - /manager
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
          env:
            # --deploy-image is left unset, so the manager reads the image it is running from
            # its own pod and hands that to every Job it stamps. That needs the pod's identity,
            # and the downward API is the only way a container learns it. An image reference
            # cannot be injected here directly: kustomize's image transformer rewrites
            # container image fields, never args or env values, so a literal would be the one
            # thing the release pipeline could not keep in step.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Resolution stages a package's metadata layers on disk before loading them, so the
            # controller needs somewhere to write even though it caches nothing: an unwritable
            # /tmp fails every resolve with "read-only file system" on the mkdir, which reads
            # as a registry or signature problem rather than a missing volume. Kilobytes -
            # zarf.yaml, checksums, and the signature bundle - never a package.
            - name: tmp
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
