# The provider label is what makes this installable: clusterctl and Rancher Turtles identify a
# provider's components by `cluster.x-k8s.io/provider`, and the contract label
# `cluster.x-k8s.io/<contract>: <crd versions>` on each CRD is how the core controllers decide
# which version of this provider's API to talk - a CRD without it is ignored rather than
# rejected. Mirrors cluster-api-provider-cargoship's config/default.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: caapz-system
namePrefix: caapz-
labels:
  - includeSelectors: false
    pairs:
      cluster.x-k8s.io/provider: addon-zarf
      cluster.x-k8s.io/v1beta2: v1alpha1
resources:
  - ../crd
  - ../rbac
  - ../manager
