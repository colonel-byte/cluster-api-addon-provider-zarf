# clusterctl reads this to map a release of this repository to a Cluster API contract version.
# Without it `clusterctl init` and `clusterctl upgrade` refuse to install the provider, because
# they have no way to know which core Cluster API it was built against.
#
# Only the top entry is moved by release-please; past series are appended below it as releases
# are cut, so `clusterctl upgrade` can map an installed version while planning an upgrade. Each
# past entry's contract is what that series' own metadata.yaml declared at its tag, not an
# assumption. This mirrors the sister repository's (cargoship's) metadata.yaml.
---
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Metadata
releaseSeries:
  - major: 0 # x-release-please-major
    minor: 2 # x-release-please-minor
    contract: v1beta2
  - major: 0
    minor: 2
    contract: v1beta2
  - major: 0
    minor: 1
    contract: v1beta2
